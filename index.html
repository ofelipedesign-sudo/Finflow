  <!-- TELA DE LOGIN OBRIGATÓRIA (BLOQUEIO INICIAL) -->
  <div id="authGateOverlay" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-100 flex flex-col gap-4 animate-in fade-in zoom-in duration-200">
      
      <div class="text-center">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center text-white mx-auto shadow-md shadow-brand-500/20 mb-3">
          <i class="ph-bold ph-wallet text-2xl"></i>
        </div>
        <h2 class="text-xl font-bold text-slate-900">Bem-vindo ao FinFlow</h2>
        <p class="text-xs text-slate-500 mt-1">Acesse com seu e-mail para carregar suas finanças.</p>
      </div>

      <!-- Abas Entrar / Criar Conta -->
      <div class="flex border border-slate-200 rounded-xl p-1 bg-slate-100 text-xs font-semibold">
        <button type="button" id="gateTabLogin" onclick="setGateAuthMode('login')" class="flex-1 py-1.5 rounded-lg bg-white text-slate-900 shadow-sm transition">Entrar</button>
        <button type="button" id="gateTabRegister" onclick="setGateAuthMode('register')" class="flex-1 py-1.5 rounded-lg text-slate-600 transition">Criar Conta</button>
      </div>

      <!-- Formulário de Autenticação -->
      <form id="formGateAuth" onsubmit="handleGateAuthSubmit(event)" class="flex flex-col gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">E-mail</label>
          <input type="email" id="gateAuthEmail" required placeholder="seu@email.com" class="w-full px-3 py-2 text-xs rounded-lg border border-slate-200 focus:outline-none focus:border-brand-500">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Senha</label>
          <input type="password" id="gateAuthPassword" required minlength="6" placeholder="Mínimo 6 caracteres" class="w-full px-3 py-2 text-xs rounded-lg border border-slate-200 focus:outline-none focus:border-brand-500">
        </div>

        <button type="submit" id="btnGateAuthSubmit" class="w-full mt-2 py-2.5 text-xs font-bold rounded-xl bg-brand-600 hover:bg-brand-700 text-white shadow-sm transition">Entrar no FinFlow</button>
      </form>

    </div>
  </div>

  <!-- Header Principal -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4">

        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center text-white shadow-md shadow-brand-500/20">

        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-xl font-bold tracking-tight text-slate-900 leading-none">FinFlow</h1>
            <span class="text-[10px] font-semibold uppercase px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 border border-emerald-200">Sincronizado</span>
          </div>
          <p class="text-xs text-slate-500 mt-0.5">Gestão Financeira Multidispositivo</p>
        </div>
      </div>

          <i id="authIcon" class="ph-bold ph-user-check text-base text-emerald-600"></i>
          <span id="labelAuthStatus">Minha Conta</span>
        </button>

        <button onclick="openResetModal()" class="flex items-center gap-1.5 px-3 py-2 text-xs font-medium rounded-lg border border-slate-200 text-slate-600 bg-white hover:bg-slate-50 hover:text-slate-900 transition shadow-sm">
          <i class="ph-bold ph-arrows-counter-clockwise text-base text-amber-500"></i>
          <span class="hidden sm:inline">Resetar</span>
        </button>

        <button onclick="exportCSV()" class="flex items-center gap-1.5 px-3 py-2 text-xs font-medium rounded-lg border border-slate-200 text-slate-600 bg-white hover:bg-slate-50 hover:text-slate-900 transition shadow-sm">
